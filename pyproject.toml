[project]
name = "pigwars"
version = "0.1.0"
description = "PigWars Telegram bot MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.18.0,<4.0.0",
  "alembic>=1.14.1,<2.0.0",
  "asyncpg>=0.30.0,<0.31.0",
  "fastapi>=0.116.0,<1.0.0",
  "greenlet>=3.1.1,<4.0.0",
  "pydantic-settings>=2.8.1,<3.0.0",
  "redis[hiredis]>=5.2.1,<6.0.0",
  "sqlalchemy>=2.0.38,<3.0.0",
  "uvicorn>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21.0,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "pytest>=8.3.5,<9.0.0",
  "pytest-asyncio>=0.25.3,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
