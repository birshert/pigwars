<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>PigWars Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/me/assets/me.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script defer src="/me/assets/me.js"></script>
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">PigWars member dashboard</p>
          <h1 id="viewer-name">Загрузка...</h1>
          <p class="hero__lead">
            Личный кабинет игрока: состояние твоих свиней, статус по группам и всё важное без спама командами.
          </p>
        </div>
        <div class="hero__meta">
          <div class="hero__meta-card">
            <span>Обновлено</span>
            <strong id="generated-at">...</strong>
          </div>
          <button id="refresh-button" class="refresh-button" type="button">Обновить</button>
        </div>
      </header>

      <main class="layout">
        <section class="section">
          <div class="section__header">
            <div>
              <p class="eyebrow">Сводка</p>
              <h2>Твой прогресс</h2>
            </div>
            <span id="status-pill" class="status-pill status-pill--loading">Загрузка</span>
          </div>
          <div id="summary-grid" class="summary-grid"></div>
        </section>

        <section class="section section--wide">
          <div class="section__header">
            <div>
              <p class="eyebrow">Профили</p>
              <h2>Твои свиньи по группам</h2>
            </div>
          </div>
          <div id="pig-cards" class="pig-cards"></div>
        </section>

        <section class="section section--wide">
          <div class="section__header">
            <div>
              <p class="eyebrow">Лента</p>
              <h2>Последние события</h2>
            </div>
          </div>
          <div id="recent-events" class="event-feed"></div>
        </section>
      </main>
    </div>
  </body>
</html>
