services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pigwars
      POSTGRES_USER: pigwars
      POSTGRES_PASSWORD: pigwars
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pigwars -d pigwars"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

  bot:
    build: .
    command: uv run python -m app.main
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped

  worker:
    build: .
    command: uv run python -m app.worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped

  web:
    build: .
    command: uv run python -m app.web.main
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pg_data:
